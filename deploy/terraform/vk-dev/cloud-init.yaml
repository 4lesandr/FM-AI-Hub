#cloud-config
hostname: dev-fm-agenthub
manage_etc_hosts: true
package_update: true
package_upgrade: true
packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git
  - build-essential
  - jq
  - unzip
  - nginx
  - debian-keyring
  - debian-archive-keyring
write_files:
  - path: /etc/apt/sources.list.d/docker.list
    permissions: '0644'
    content: |
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable
  - path: /etc/apt/sources.list.d/caddy-stable.list
    permissions: '0644'
    content: |
      deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main
  - path: /etc/apt/sources.list.d/nodesource.list
    permissions: '0644'
    content: |
      deb [signed-by=/usr/share/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main
runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /usr/share/keyrings/nodesource.gpg
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin caddy nodejs
  - systemctl enable --now docker
  - systemctl enable --now caddy
  - systemctl disable --now nginx || true
  - usermod -aG docker ubuntu
  - sudo -u ubuntu bash -lc 'curl -fsSL https://bun.sh/install | bash'
final_message: "cloud-init finished for dev-fm-agenthub"
