# FLOMNI overlay for helm/sim — FM AI Hub (hub.fm.flomni.ru, ns hub)
# Base: helm/sim. Apply: helm upgrade --install fm-ai-hub ./helm/sim -n hub -f deploy/helm/values-flomni.yaml
# Secrets: use existingSecret in prod — do not commit real keys.

global:
  imageRegistry: "ghcr.io"

app:
  enabled: true
  replicaCount: 1
  resources:
    limits:
      memory: "8Gi"
      cpu: "2000m"
    requests:
      memory: "4Gi"
      cpu: "1000m"
  env:
    NEXT_PUBLIC_APP_URL: "https://hub.fm.flomni.ru"
    BETTER_AUTH_URL: "https://hub.fm.flomni.ru"
    NEXT_PUBLIC_BRAND_NAME: "FM AI Hub"
    ENTERPRISE_ENABLED: "true"
    NEXT_PUBLIC_ENTERPRISE_ENABLED: "true"
    EMAIL_PASSWORD_SIGNUP_ENABLED: "false"
    # SSO_* → true after Keycloak provider registered
    SSO_ENABLED: ""
    NEXT_PUBLIC_SSO_ENABLED: ""
  secrets:
    existingSecret:
      enabled: true
      name: hub-secrets

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: hub.fm.flomni.ru
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: hub-fm-flomni-ru-tls
      hosts:
        - hub.fm.flomni.ru
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
